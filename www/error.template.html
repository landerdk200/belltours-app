<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bell Tours</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0e0d0b;color:#e9dfcc;font:16px/1.5 'Century Gothic',AppleGothic,'URW Gothic',sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{color:#BD8C42;font-size:22px;letter-spacing:.06em;margin:0}p{margin:0;max-width:420px;color:#d9cfbd}
a{display:inline-block;margin-top:8px;padding:14px 26px;border-radius:10px;background:#BD8C42;color:#0e0d0b;font-weight:700;text-decoration:none;letter-spacing:.04em}
small{color:#8f8676}
</style></head>
<body>
<h1>BELL TOURS</h1>
<p id="t">Geen verbinding met de server. Controleer of je gsm internet heeft en probeer opnieuw.</p>
<a id="b" href="__SERVER__">Opnieuw proberen</a>
<small id="s">Wat je zonder verbinding deed, staat veilig op je gsm en gaat mee zodra er weer verbinding is.</small>
<script>
(function () {
  var l = (navigator.language || 'nl').slice(0, 2), T = {
    fr: ['Pas de connexion avec le serveur. Vérifiez que votre téléphone a internet et réessayez.', 'Réessayer', 'Ce que vous avez fait sans connexion est conservé sur votre téléphone et sera envoyé dès que la connexion revient.'],
    en: ['No connection with the server. Check that your phone has internet and try again.', 'Try again', 'What you did without a connection is kept on your phone and is sent as soon as you are back online.']
  }[l];
  if (T) { document.getElementById('t').textContent = T[0]; document.getElementById('b').textContent = T[1]; document.getElementById('s').textContent = T[2]; }
  window.addEventListener('online', function () { location.href = '__SERVER__'; });
})();
</script>
</body></html>
